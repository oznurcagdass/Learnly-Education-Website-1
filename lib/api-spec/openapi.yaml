openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Shared learning content and parent notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /learning-content:
    get:
      operationId: listLearningContent
      tags: [learning]
      summary: List published learning content
      description: Returns the shared learning content visible to students and parents.
      responses:
        "200":
          description: Published learning content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningContent"
    post:
      operationId: createLearningContent
      tags: [learning]
      summary: Publish learning content
      description: Creates shared content from the teacher panel and notifies parents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningContentInput"
      responses:
        "201":
          description: Published learning content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningContent"
  /notifications:
    get:
      operationId: listNotifications
      tags: [learning]
      summary: List parent notifications
      description: Returns notifications generated by newly published learning content.
      responses:
        "200":
          description: Parent notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [learning]
      summary: Mark a parent notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LearningContent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        contentType:
          type: string
          enum: [lesson, practice, resource, announcement]
        level:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - contentType
        - level
        - authorName
        - createdAt
    LearningContentInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        contentType:
          type: string
          enum: [lesson, practice, resource, announcement]
        level:
          type: string
          minLength: 1
        authorName:
          type: string
          minLength: 1
      required:
        - title
        - description
        - contentType
        - level
        - authorName
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        contentId:
          type: ["integer", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - message
        - contentId
        - isRead
        - createdAt

